<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M1 · OpenAI 流式循环</title>
    <link rel="stylesheet" href="../shared/shared.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <p><a href="../index/index.html">← 索引</a></p>
      <h1>M1 · 统一内核 + OpenAI（默认流式）</h1>
      <p class="sub">
        固定演示：查天气 + 加法 → 最终中文总结。可见流式轮次、协议碎片拼接与 Trace 卡片回放。
      </p>

      <div class="card">
        <label for="prompt">用户请求</label>
        <textarea id="prompt">
帮我查一下深圳的天气，再用工具算一下 12 加 30，最后用中文简短总结。</textarea>
        <div class="row">
          <button id="run">运行</button>
          <button id="stop" class="secondary" disabled>取消</button>
          <button id="reloadTrace" class="secondary">加载最新 Trace</button>
          <span id="status" class="pill">idle</span>
        </div>
      </div>

      <div class="card">
        <div class="row panel-head">
          <strong>流式文本</strong>
          <span class="pill">按轮次分块</span>
        </div>
        <div id="stream" class="stream"></div>
      </div>

      <div class="card">
        <div class="row panel-head">
          <strong>协议时间线</strong>
          <span class="pill">文本/工具每帧全记，不省略</span>
        </div>
        <div id="timeline" class="timeline"></div>
      </div>

      <div class="card">
        <strong>事件流（简要）</strong>
        <div id="events" class="events"></div>
      </div>

      <div class="card">
        <div class="row panel-head">
          <strong>Trace 回放</strong>
          <button id="prev" class="secondary">上一步</button>
          <button id="next" class="secondary">下一步</button>
          <span id="stepLabel" class="pill">0 / 0</span>
        </div>
        <div class="trace-layout">
          <div id="traceRail" class="trace-rail"></div>
          <div id="trace" class="trace-main">尚未加载</div>
        </div>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
